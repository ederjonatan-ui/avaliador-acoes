<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Avaliador de Ações</title>

    <!-- Chart.js + Financial Chart -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 15px;
        }

        input, select, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 6px;
            border: none;
            font-size: 16px;
        }

        button {
            background: #0a84ff;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #006edc;
        }

        #autocomplete-list {
            background: #222;
            border: 1px solid #444;
            margin-top: 5px;
            border-radius: 6px;
            max-height: 150px;
            overflow-y: auto;
        }

        .autocomplete-item {
            padding: 10px;
            cursor: pointer;
        }

        .autocomplete-item:hover {
            background: #333;
        }

        .card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .listas {
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }

        .lista {
            flex: 1;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
        }

        .lista ul {
            list-style: none;
            padding: 0;
        }

        .lista li {
            padding: 10px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
        }

        .timer-tag {
            background: #0a84ff;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 12px;
        }

        /* Tela de bloqueio */
        #lock-screen {

            top: 0; left: 0;
            width: 100%; height: 100%;
