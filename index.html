<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Avaliador de Ações — IA Híbrida</title>

<link rel="stylesheet" href="style.css" />

<!-- Plotly -->
<script src="https://cdn.plot.ly/plotly-latest.min.js"></script>

<style>
body {
  background: #0b1221;
  color: white;
  font-family: Arial, sans-serif;
  margin: 0;
  padding: 0;
}

#update-bar {
  width: 0%;
  height: 4px;
  background: linear-gradient(90deg,#00aaff,#00d68f);
  position: fixed;
  top: 0;
  left: 0;
  opacity: 0;
  transition: width 3s linear, opacity 0.5s ease;
  z-index: 9999;
}

.container {
  padding: 20px;
}

.section {
  margin-top: 20px;
}

#buy-list, #sell-list {
  max-height: 260px;
  overflow-y: auto;
  padding-right: 10px;
}

.company-row {
  display: flex;
  justify-content: space-between;
  padding: 10px;
  background: #111a2e;
  margin-bottom: 8px;
  border-radius: 8px;
}

.btn-buy {
  background: linear-gradient(135deg,#00d68f,#00a86b);
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

.btn-sell {
  background: linear-gradient(135deg,#ff4b6e,#d63a5a);
  color: white;
  border: none;
  padding: 6px 10px;
  border-radius: 6px;
  cursor: pointer;
}

#resultado-total {
  margin-top: 20px;
  font-size: 20px;
  text-align: center;
}
</style>
</head>

<body>

<div id="update-bar"></div>

<div class="container">

<h1>Avaliador de Ações — IA Híbrida</h1>

<div>
  <input id="ticker-input" placeholder="Digite o ticker (ex: PETR4)" />
  <button id="btnAvaliar">Avaliar</button>
</div>

<h2>Gráfico</h2>
<div id="chart" style="height: 350px;"></div>
<div id="chart-subtitle"></div>

<h2>Empresas que Compensa Comprar</h2>
<div id="buy-list"></div>

<h2>Empresas que Compensa Vender</h2>
<div id="sell-list"></div>

<div id="resultado-total">Margem total acumulada: 0 R$</div>

</div>

<script src="app.js"></script>
</body>
</html>
