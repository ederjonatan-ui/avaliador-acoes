<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avaliador de Ações</title>

<style>
    body {
        background: #000;
        color: #fff;
        font-family: Arial, sans-serif;
        margin: 0;
        padding: 20px;
    }

    .container {
        max-width: 900px;
        margin: auto;
    }

    input, button {
        padding: 12px;
        font-size: 18px;
        border-radius: 8px;
        border: none;
    }

    input {
        width: 70%;
        background: #111;
        color: #fff;
        border: 1px solid #333;
    }

    button {
        background: #0f9d58;
        color: #fff;
        cursor: pointer;
    }

    .card {
        background: #111;
        padding: 20px;
        border-radius: 12px;
        margin-top: 20px;
        border: 1px solid #222;
    }

    /* LISTAS DE COMPRAR / VENDER */
    .listas-container {
        display: flex;
        gap: 20px;
        margin-top: 30px;
    }

    .lista-card {
        flex: 1;
        background: #111;
        padding: 20px;
        border-radius: 12px;
        border: 1px solid #222;
    }

    .lista-card h3 {
        margin-bottom: 10px;
        color: #0f9d58;
    }

    .lista-card ul {
        list-style: none;
        padding: 0;
    }

    .lista-card li {
        padding: 8px 0;
        border-bottom: 1px solid #222;
    }
</style>
</head>

<body>
<div class="container">

    <h1>Avaliador de Ações</h1>

    <input id="tickerInput" placeholder="Digite o ticker (ex: VALE3)">
    <button onclick="buscarDados()">Avaliar</button>

    <div id="resultado" class="card"></div>

    <!-- LISTAS AUTOMÁTICAS -->
    <div class="listas-container">
        <div class="lista-card">
            <h3>📈 Empresas que Compensa Comprar</h3>
            <ul id="listaComprar"></ul>
        </div>

        <div class="lista-card">
            <h3>📉 Empresas que Compensa Vender</h3>
            <ul id="listaVender"></ul>
        </div>
    </div>

</div>

<script>
async function buscarDados() {
    const ticker = document.getElementById("tickerInput").value.trim().toUpperCase();
    if (!ticker) return;

    document.getElementById("resultado").innerHTML = "Carregando...";

    try {
        const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}?modules=financialData,price,summaryDetail`;
        const resposta = await fetch(url);
        const json = await resposta.json();

        const price = json.quoteSummary.result[0].price;
        const financial = json.quoteSummary.result[0].financialData;

        const nome = price.longName || ticker;
        const atual = price.regularMarketPrice.raw;
        const alvo = financial.targetMeanPrice.raw;

        let recomendacao = "Neutro";
        if (alvo > atual * 1.10) recomendacao = "Comprar";
        if (alvo < atual * 0.90) recomendacao = "Vender";

        document.getElementById("resultado").innerHTML = `
            <h2>${nome} (${ticker})</h2>
            <p>Preço atual: R$ ${atual}</p>
            <p>Preço alvo: R$ ${alvo}</p>
            <p><strong>Recomendação: ${recomendacao}</strong></p>
        `;

        atualizarListas(ticker, nome, recomendacao);

    } catch (e) {
        document.getElementById("resultado").innerHTML = "Erro ao buscar dados.";
    }
}

/* LISTAS AUTOMÁTICAS */
const listaComprar = document.getElementById("listaComprar");
const listaVender = document.getElementById("listaVender");

function atualizarListas(ticker, nomeEmpresa, recomendacao) {
    const li = document.createElement("li");
    li.textContent = `${nomeEmpresa} (${ticker})`;

    if (recomendacao.includes("Comprar")) {
        listaComprar.appendChild(li);
    }

    if (recomendacao.includes("Vender")) {
        listaVender.appendChild(li);
    }
}
</script>

</body>
</html>
